name: Weekly Analytics Report

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: 

jobs:
  send-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно: дает право боту делать коммиты в репозиторий
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run report script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: node scripts/generate-report.js

      - name: Save previous metrics to repo
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add previous_metrics.json
          git commit -m "chore: update previous metrics for weekly report" || exit 0
          git push